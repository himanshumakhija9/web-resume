<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Himanshu Makhija</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{--bg:#eeede6;--card:#faf9f5;--tan:#e2dccf;--fg:#141413;--mut:#5e5d57;--line:#d6d2c5;--acc:#d97757;--ink:#b4532f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.1rem/1.55 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,nav,.logo,.btn,.pill,.drow,.sh,.row b,summary,.role,.stat,.end,footer,.proof h3,.proof a{font-family:"Instrument Sans",system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5em;letter-spacing:-.025em;line-height:1.1}
h1{font-size:clamp(2.4rem,6vw,4.4rem);font-weight:600;letter-spacing:-.04em;line-height:1.02}
h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:600;margin:3em 0 .8em}
h3{font-size:1.25rem;font-weight:600}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px 80px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-weight:600;font-size:1.05rem;text-decoration:none;letter-spacing:-.02em}
.hr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
nav{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:1rem}
nav a{text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
nav a.on{border-color:var(--fg)}
.pill{background:var(--tan);padding:10px 20px;border-radius:999px;text-decoration:none;font-size:1rem}
a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{padding:72px 0 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px 60px;align-items:center}
.role{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.95rem;margin:0}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.lead{font-size:1.3rem;line-height:1.45;margin:0;max-width:36ch}
.cta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{background:var(--fg);color:var(--bg);padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:500}
.btn.s{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.himg,.jimg,.fimg{width:100%;border-radius:24px;object-fit:cover;display:block}
.himg{max-height:520px;margin-top:24px}
.portrait{width:200px;aspect-ratio:1;object-fit:cover;object-position:center 20%;border-radius:24px;display:block;margin-bottom:24px}
.fimg{position:sticky;top:24px}
.jimg{max-height:340px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--tan);border-radius:24px;padding:30px}
.card p{margin:0}
.job{background:var(--card);border-radius:24px;padding:34px;margin:18px 0}
.job h3{font-size:1.7rem;margin-bottom:.8em}
.drow{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:1rem}
.drow span{font-family:"Geist Mono",ui-monospace,monospace;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.drow b{font-weight:500;text-align:right}
.tag{font-weight:600;font-size:1.15rem;margin:22px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin:22px 0 26px}
.stat b{display:block;font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.stat span{display:block;color:var(--mut);font-size:.9rem;line-height:1.4;margin-top:8px}
.job p{margin:0 0 1em}
ul{margin:.3em 0 0;padding-left:1.2em}
li{margin:.4em 0}
.sheet{background:var(--card);border-radius:24px;padding:4px 40px 16px;margin-top:30px}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:28px 0 22px;border-bottom:1.5px solid var(--fg);font-size:1.15rem}
.sh span{color:var(--mut)}
.req{display:grid;grid-template-columns:1fr 1fr;gap:12px 48px;padding:34px 0;border-top:1px solid var(--line)}
.sh + .req{border-top:0}
.ask{font-size:1.45rem;line-height:1.55;margin:0}
mark{background:rgba(217,119,87,.28);color:inherit;padding:2px 6px;border-radius:4px}
.proof p{margin:0}
.proof h3{color:var(--ink);font-size:1.15rem;font-weight:500;margin:0 0 .5em}
.proof ul{margin:0;padding-left:1.2em;color:var(--ink)}
.proof a{display:inline-block;margin-top:14px;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 48px}
.faqwrap{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;margin-top:30px;align-items:start}
.faqwrap.noimg{grid-template-columns:1fr}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:26px 0;font-size:1.45rem;font-weight:500;letter-spacing:-.02em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400}
details[open] summary::after{content:"\2212"}
.ans{margin:0 0 28px;max-width:62ch}.ans ul{margin:.6em 0 0}.ans a{color:var(--ink)}
.get{display:grid;grid-template-columns:1fr 1.2fr;gap:30px 60px;background:var(--tan);border-radius:24px;padding:48px;margin-top:90px;align-items:center}
.get h2{margin:0 0 .3em}
.get p{margin:0;color:var(--mut);font-size:1.2rem}
.row{display:flex;justify-content:space-between;gap:4px 16px;flex-wrap:wrap;padding:20px 0;border-bottom:1px solid var(--line);text-decoration:none}
.row b{font-weight:500;font-size:1.1rem}
.row span{color:var(--mut);font-size:.95rem}
.row:hover b{color:var(--ink)}
.end{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:12px;padding:34px 0 0;margin-top:50px}
.end a{font-size:2rem;font-weight:600;letter-spacing:-.03em;text-decoration:none}
footer{margin-top:40px;font-size:.8rem;color:var(--mut);font-family:"Instrument Sans",sans-serif}
@media (max-width:760px){.hero,.req,.get,.faqwrap{grid-template-columns:1fr}.job{padding:24px}.sheet{padding:4px 22px 10px}.get{padding:28px}}
</style>
</head>

<div class="wrap">
<header><a class="logo" href="#/" id="logo"></a><div class="hr"><nav id="nav"></nav><a class="pill" id="say">Say hello ↗</a></div></header>
<main id="main"></main>
<footer id="foot"></footer>
</div>

const IM = Object.assign({}, ME.images, A.images);
const $ = s => document.querySelector(s);
const li = a => a.map(x => "<li>" + x + "</li>").join("");
const img = (src, cls, alt) => src ? '<img class="' + cls + '" src="' + src + '" alt="' + (alt || "") + '">' : "";
const mark = (t, h) => h ? t.replace(h, "<mark>" + h + "</mark>") : t;
const resume = A.resume || ME.resume;
document.title = ME.name + " | " + A.role + (A.company ? ", " + A.company : "");
document.documentElement.style.setProperty("--acc", A.accent);
$("#logo").textContent = ME.name;
$("#say").href = "mailto:" + ME.email;
$("#foot").textContent = A.company ? "A personal portfolio for a role at " + A.company + ". Not affiliated with or endorsed by " + A.company + "." : A.footer;

const jobs = () => A.careerOrder.map(id => {
  const c = CAREER.find(j => j.id === id);
  return c && Object.assign({}, c, A.overrides[id] || {});
}).filter(Boolean);

const contact = () => '<section class="get"><div><h2>Get in touch</h2>' + (A.contactLine ? '<p>' + A.contactLine + '</p>' : "") + '</div><div><a class="row" href="mailto:' + ME.email + '"><b>Say hello</b><span>' + ME.email + '</span></a><a class="row" href="' + ME.linkedin + '" target="_blank" rel="noopener"><b>LinkedIn ↗</b><span>linkedin.com/in/himanshu-makhija</span></a><a class="row" href="' + resume + '" target="_blank" rel="noopener"><b>View résumé ↗</b><span>Latest version</span></a></div></section><div class="end"><a href="#/">Back to the start →</a></div>';

const H = t => '<h1 style="margin-top:44px">' + t + '</h1>';
const pages = {
 "/": () => '<section class="hero"><p class="role">' + (A.company ? 'Applying for ' + A.role + ' at ' + A.company : A.role) + '</p><h1>' + A.headline + '</h1><div>' + img(IM.portrait, "portrait", "Himanshu Makhija") + '<p class="lead">' + A.intro + '</p></div><div class="cta"><a class="btn" href="#/' + (A.reqs ? 'why">Why this role' : 'faq">FAQ') + '</a><a class="btn s" href="#/career">My career</a></div></section>' + img(IM.hero, "himg") + '<h2>The short version</h2><div class="grid">' +
   A.short.map(s => '<div class="card"><h3>' + s[0] + '</h3><p>' + s[1] + '</p></div>').join("") + '</div>' + contact(),
 "/career": () => H(A.careerTitle || 'Nine years, five roles, one pattern.') + ((A.careerLead === undefined ? 'Find the problem, measure it, build the fix, get people to use it.' : A.careerLead) ? '<p class="lead">' + (A.careerLead === undefined ? 'Find the problem, measure it, build the fix, get people to use it.' : A.careerLead) + '</p>' : "") +
   jobs().map(c => '<article class="job" id="' + c.id + '"><h3>' + c.title + '</h3><div class="drow"><span>Company</span><b>' + c.org + '</b></div><div class="drow"><span>Period</span><b>' + c.dates + '</b></div>' + img(c.img, "jimg") + '<p class="tag">' + c.tag + '</p><div class="stats">' +
   c.stats.map(s => '<div class="stat"><b>' + s[0] + '</b><span>' + s[1] + '</span></div>').join("") + '</div><p>' + c.story + '</p><ul>' + li(c.bullets) + '</ul></article>').join("") + contact(),
 "/why": () => H('What the role asks for, and where I have done it.') + '<p class="lead">The posting for ' + A.role + ', summarised in my own words, with the closest thing I have done next to each part.</p><section class="sheet"><div class="sh"><b>' + A.role + ', ' + A.company + '</b><span>What the role asks for, summarised</span></div>' +
   A.reqs.map(r => '<div class="req"><p class="ask">' + mark(r.ask, r.hl) + '.</p><div class="proof"><h3>← ' + (r.label || "Where I have done this") + '</h3><ul>' + li(r.proof) + '</ul><a href="#/career" data-job="' + r.link + '">See it on the career page →</a></div></div>').join("") +
   '</section><h2>What I would bring, and what I would need to learn</h2><div class="two"><div><h3>What I would bring</h3><ul>' + li(A.bring) + '</ul></div><div><h3>What I would need to learn</h3><ul>' + li(A.learn) + '</ul></div></div>' + contact(),
 "/faq": () => H('A few straight answers.') + '<div class="faqwrap' + (IM.faq ? "" : " noimg") + '"><div>' + A.faq.map(f => '<details><summary>' + f[0] + '</summary><div class="ans">' + f[1] + '</div></details>').join("") + '</div>' + img(IM.faq, "fimg", "Himanshu holding an award trophy at a conference") + '</div>' + contact()
};

const navItems = [["/career", "Career"]].concat(A.reqs ? [["/why", "Why this role"]] : [], [["/faq", "FAQ"]]);
function route() {
  const p = (location.hash.slice(1) || "/").split("?")[0];
  const path = pages[p] && (p !== "/why" || A.reqs) ? p : "/";
  $("#nav").innerHTML = navItems.map(n => '<a href="#' + n[0] + '"' + (n[0] === path ? ' class="on"' : "") + ">" + n[1] + "</a>").join("");
  $("#main").innerHTML = pages[path]();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-job]");
  if (!a) return;
  e.preventDefault();
  location.hash = "#/career";
  setTimeout(() => { const t = document.getElementById(a.dataset.job); if (t) t.scrollIntoView(); }, 0);
});
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
