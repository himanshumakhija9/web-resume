<title>Himanshu Makhija</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Geist+Mono:wght@400&display=swap">
<style>
:root{--bg:#eeede6;--card:#faf9f5;--tan:#e2dccf;--fg:#141413;--mut:#5e5d57;--line:#d6d2c5;--acc:#d97757;--ink:#b4532f;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:400 1.1rem/1.55 "Source Serif 4",Georgia,serif;-webkit-font-smoothing:antialiased}
h1,h2,h3,nav,.logo,.btn,.pill,.drow,.sh,.row b,summary,.role,.stat,.end,footer,.proof h3,.proof a{font-family:"Instrument Sans",system-ui,sans-serif}
h1,h2,h3{margin:0 0 .5em;letter-spacing:-.025em;line-height:1.1}
h1{font-size:clamp(1.9rem,4.4vw,3rem);font-weight:600;letter-spacing:-.035em;line-height:1.08}
h2{font-size:clamp(1.3rem,2.4vw,1.7rem);font-weight:600;margin:2.4em 0 .8em}
h3{font-size:1.25rem;font-weight:600}
a{color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:0 28px 80px}
header{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:center;justify-content:space-between;padding:22px 0}
.logo{font-weight:600;font-size:1.05rem;text-decoration:none;letter-spacing:-.02em}
.hr{display:flex;flex-wrap:wrap;align-items:center;gap:8px 28px}
nav{display:flex;flex-wrap:wrap;gap:6px 26px;font-size:1rem}
nav a{text-decoration:none;padding:6px 0;border-bottom:2px solid transparent}
nav a.on{border-color:var(--fg)}
.pill{background:var(--tan);padding:10px 20px;border-radius:999px;text-decoration:none;font-size:1rem}
a:focus-visible,summary:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.hero{padding:72px 0 28px;display:grid;grid-template-columns:1.25fr 1fr;gap:20px 60px;align-items:center}
.role{grid-column:1/-1;display:flex;align-items:center;gap:10px;color:var(--mut);font-size:.95rem;margin:0}
.role::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--acc);flex:none}
.lead{font-size:1.3rem;line-height:1.45;margin:0;max-width:36ch}
.cta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.btn{background:var(--fg);color:var(--bg);padding:13px 22px;border-radius:12px;text-decoration:none;font-weight:500}
.btn.s{background:transparent;color:var(--fg);border:1.5px solid var(--fg)}
.himg,.jimg,.fimg{width:100%;border-radius:24px;object-fit:cover;display:block}
.himg{max-height:520px;margin-top:24px}
.portrait{width:200px;aspect-ratio:1;object-fit:cover;object-position:center 20%;border-radius:24px;display:block;margin-bottom:24px}
.fimg{position:sticky;top:24px}
.jimg{max-height:340px;margin:18px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.card{background:var(--tan);border-radius:24px;padding:30px}
.card p{margin:0}
.job{background:var(--card);border-radius:24px;padding:34px;margin:18px 0}
.job h3{font-size:1.7rem;margin-bottom:.8em}
.drow{display:flex;justify-content:space-between;gap:20px;padding:12px 0;border-top:1px solid var(--line);font-size:1rem}
.drow span{font-family:"Geist Mono",ui-monospace,monospace;font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
.drow b{font-weight:500;text-align:right}
.tag{font-weight:600;font-size:1.15rem;margin:22px 0 0}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:20px;margin:22px 0 26px}
.stat b{display:block;font-weight:600;font-size:2.4rem;line-height:1;letter-spacing:-.03em}
.stat span{display:block;color:var(--mut);font-size:.9rem;line-height:1.4;margin-top:8px}
.job p{margin:0 0 1em}
ul{margin:.3em 0 0;padding-left:1.2em}
li{margin:.4em 0}
.sheet{background:var(--card);border-radius:24px;padding:4px 40px 16px;margin-top:30px}
.sh{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;padding:28px 0 22px;border-bottom:1.5px solid var(--fg);font-size:1.15rem}
.sh span{color:var(--mut)}
.req{display:grid;grid-template-columns:1fr 1fr;gap:12px 48px;padding:34px 0;border-top:1px solid var(--line)}
.sh + .req{border-top:0}
.ask{font-size:1.45rem;line-height:1.55;margin:0}
mark{background:rgba(217,119,87,.28);color:inherit;padding:2px 6px;border-radius:4px}
.proof p{margin:0}
.proof h3{color:var(--ink);font-size:1.15rem;font-weight:500;margin:0 0 .5em}
.proof ul{margin:0;padding-left:1.2em;color:var(--ink)}
.proof a{display:inline-block;margin-top:14px;color:var(--ink);text-decoration:underline;text-underline-offset:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px 48px}
details{border-top:1px solid var(--line)}
summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:16px;padding:26px 0;font-size:1.45rem;font-weight:500;letter-spacing:-.02em}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-weight:400}
details[open] summary::after{content:"\2212"}
.ans{margin:0 0 28px;max-width:62ch}.ans ul{margin:.6em 0 0}.ans a{color:var(--ink)}
.get{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:18px 32px;background:var(--tan);border-radius:24px;padding:26px 36px;margin-top:80px}
.get h2{margin:0;font-size:clamp(1.4rem,2.4vw,1.8rem)}
.get p{margin:6px 0 0;color:var(--mut);font-size:1.05rem}
.links{display:flex;flex-wrap:wrap;gap:10px}
.ic{display:inline-flex;align-items:center;gap:10px;padding:11px 18px;border-radius:999px;background:var(--card);font:500 1rem "Instrument Sans",system-ui,sans-serif;text-decoration:none;color:var(--fg);transition:background .15s,color .15s}
.ic svg{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ic svg.f{fill:currentColor;stroke:none}
.ic:hover{background:var(--fg);color:var(--bg)}
.jhead{display:flex;align-items:center;gap:16px;margin-bottom:.8em}
.jhead h3{margin:0;font-size:1.7rem}
.logo-b{display:inline-flex;align-items:center;justify-content:center;flex:none;min-width:56px;height:44px;padding:0 12px;border-radius:12px;font:700 .8rem/1 "Instrument Sans",system-ui,sans-serif;letter-spacing:.04em;overflow:hidden}
.logo-b img{height:100%;width:auto;max-width:96px;object-fit:contain;display:block}
.end{display:flex;justify-content:flex-end;align-items:center;flex-wrap:wrap;gap:12px;padding:34px 0 0;margin-top:50px}
.end a{font-size:2rem;font-weight:600;letter-spacing:-.03em;text-decoration:none}
.bicon{width:84px;height:84px;border-radius:22%;display:block;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px;list-style:none;padding:0;margin:18px 0 0}
.chips li{margin:0;background:var(--tan);border-radius:999px;padding:6px 14px;font:500 .9rem "Instrument Sans",sans-serif}
.job .cta{margin-top:24px}
.bsplit{display:grid;grid-template-columns:1fr 300px;gap:32px;align-items:start}
.bgal{display:grid;grid-template-columns:1fr 1.2fr;gap:14px;margin-top:22px;align-items:stretch}
.bgal img{width:100%;height:100%;object-fit:cover;border-radius:20px;display:block}
.bphoto{width:100%;border-radius:20px;display:block;margin-top:22px}
@media (max-width:760px){.bsplit{grid-template-columns:1fr}.bgal{grid-template-columns:1fr}.bgal img{height:auto}}
footer{margin-top:40px;font-size:.8rem;color:var(--mut);font-family:"Instrument Sans",sans-serif}
@media (max-width:760px){.hero,.req{grid-template-columns:1fr}.job{padding:24px}.sheet{padding:4px 22px 10px}.get{padding:22px}.jhead h3{font-size:1.4rem}}

@media (max-width:760px){
body{font-size:1.02rem}
.wrap{padding:0 18px 56px}
header{padding:14px 0 6px;gap:8px 16px}
.hr{width:100%;justify-content:space-between;gap:6px 12px}
nav{gap:2px 18px;font-size:.95rem}
nav a{padding:8px 0}
.pill{padding:8px 16px;font-size:.95rem}
.hero{padding:28px 0 16px;gap:16px}
.lead{font-size:1.12rem;max-width:none}
.portrait{width:132px;margin-bottom:6px}
.cta{gap:8px}
.cta .btn{flex:1 1 auto;text-align:center;padding:12px 16px}
.card{padding:22px;border-radius:20px}
.job{padding:20px;border-radius:20px}
.job h3,.jhead h3{font-size:1.2rem}
.jhead{gap:12px}
.logo-b{min-width:48px;height:38px;font-size:.7rem}
.drow{padding:10px 0;gap:12px;font-size:.95rem}
.stats{grid-template-columns:repeat(3,1fr);gap:12px}
.stat b{font-size:1.7rem}
.stat span{font-size:.8rem}
.tag{font-size:1.05rem}
.sheet{padding:2px 18px 6px;border-radius:20px}
.sh{padding:20px 0 16px;font-size:1rem}
.req{padding:22px 0;gap:8px}
.ask{font-size:1.15rem}
summary{font-size:1.1rem;padding:18px 0}
.ans{margin-bottom:20px}
.get{padding:20px;margin-top:48px;border-radius:20px}
.links{width:100%}
.ic{flex:1 1 auto;justify-content:center;padding:11px 14px}
.end a{font-size:1.4rem}
.end{margin-top:32px;padding-top:22px;justify-content:flex-start}
.bicon{width:64px;height:64px}
.fimg{position:static}
.himg{max-height:340px}
.jimg{max-height:240px}
}
@media (max-width:380px){.stats{grid-template-columns:1fr 1fr}}
</style>

const navItems = [["/", "Home"], ["/career", "Web résumé"]].concat(B ? [["/builds", "Beyond the résumé"]] : [], A.reqs ? [["/why", "Why this role"]] : []);
function route() {
  const p = (location.hash.slice(1) || "/").split("?")[0];
  const path = pages[p] && (p !== "/why" || A.reqs) && (p !== "/builds" || B) ? p : "/";
  $("#nav").innerHTML = navItems.map(n => '<a href="#' + n[0] + '"' + (n[0] === path ? ' class="on"' : "") + ">" + n[1] + "</a>").join("");
  $("#main").innerHTML = pages[path]();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-job]");
  if (!a) return;
  e.preventDefault();
  location.hash = "#/career";
  setTimeout(() => { const t = document.getElementById(a.dataset.job); if (t) t.scrollIntoView(); }, 0);
});
addEventListener("hashchange", route);
